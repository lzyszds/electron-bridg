name: 构建安装包

on:
  # 手动触发，可选只构建某一个平台
  workflow_dispatch:
    inputs:
      build_mac:
        description: 构建 macOS 安装包
        type: boolean
        default: true
      build_win:
        description: 构建 Windows 安装包
        type: boolean
        default: true
  # 推送 v* 标签时自动构建并发布 Release
  push:
    tags:
      - 'v*'
  # PR 只做类型检查，不打包
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------ 类型检查 ------------------------------
  check:
    name: 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验类型
        run: npm run typecheck

  # ------------------------------ macOS 打包 ------------------------------
  mac:
    name: macOS 打包
    runs-on: macos-14
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_mac)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 dmg / zip（arm64 + x64）
        run: npm run build:mac
        env:
          # 无签名证书时跳过签名，避免打包失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  # ----------------------------- Windows 打包 -----------------------------
  win:
    name: Windows 打包
    runs-on: windows-latest
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_win)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 nsis 安装包（x64 + arm64）
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: release/*.exe
          if-no-files-found: error

  # ------------------------ 打标签时发布 GitHub Release ------------------------
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - mac
      - win
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
